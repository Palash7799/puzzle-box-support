<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4ab8ff" />
    <title>Gumdrop Bounce</title>
    <script type="module" crossorigin src="./assets/index-DhlpNUuX.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-N1-1xwv1.css">
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud" class="hidden">
      <div class="pill" id="gems"><i class="gem"></i><b id="gemN">0</b><span id="gemT">/ 30</span></div>
      <div class="pill" id="time">0:00</div>
      <div class="pill rock hidden" id="rock">Rock form <b id="rockN"></b></div>
      <button class="pill btn" id="hudmap" aria-label="World map">☰</button>
      <button class="pill btn" id="pause" aria-label="Restart">⟲</button>
    </div>
    <div id="touch" class="hidden">
      <div class="pad">
        <button id="bl" aria-label="Left">◀</button>
        <button id="br" aria-label="Right">▶</button>
      </div>
      <div class="jumps">
        <button id="bd" aria-label="Slam">▼</button>
        <button id="bj" aria-label="Jump">▲</button>
      </div>
    </div>
    <div id="rotate" class="hidden"><div><span class="phone">📱</span><b>Turn your phone sideways</b><small>Gumdrop Bounce plays in landscape</small></div></div>
    <div id="swipehint" class="hidden"><div><b>Left thumb</b>: drag to roll &nbsp;·&nbsp; <b>Right thumb</b>: flick ⬆ jump, ⬇ slam</div></div>
    <div id="title" class="screen">
      <div class="titlebox">
        <h1 class="logo"><span class="l1">Gumdrop</span><span class="l2">Bounce</span></h1>
        <button id="play" class="playbtn" aria-label="Play">PLAY<i>▶</i></button>
        <div class="segrow">
        <div class="seg" role="group" aria-label="Controls">
          <button id="schemeBtn" class="on">Buttons</button>
          <button id="schemeSwipe">Swipe</button>
        </div>
        <div class="seg" role="group" aria-label="Look">
          <button id="look2d">2D</button>
          <button id="look3d">3D</button>
        </div>
        </div>
        <small>Arrow keys / WASD + Space, ↓ to slam &nbsp;·&nbsp; or touch: buttons or swipes</small>
      </div>
    </div>
    <div id="map" class="hidden">
      <div class="mapart" id="mapart"></div>
      <div class="maptop"><button class="pill btn" id="mapback" aria-label="Back">◀</button><b class="maptitle">World Map</b><div class="pill" id="mapgems"><i class="gem"></i><b id="mapgemN">0</b></div></div>
    </div>
    <div id="done" class="screen hidden">
      <div class="card">
        <h2>Level complete!</h2>
        <div class="stats"><div><i class="gem"></i><b id="dGems"></b></div><div>⏱ <b id="dTime"></b></div><div>💥 <b id="dDeaths"></b></div></div>
        <button id="next" class="big hidden">NEXT WORLD ▶</button>
        <button id="again" class="big">PLAY AGAIN</button>
        <button id="tomap" class="big alt">MAP</button>
      </div>
    </div>
  </body>
</html>
