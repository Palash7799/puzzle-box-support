  <body>
    <!-- splash: plain HTML so it shows the instant the page opens, before any script or model loads (2026-11-23: was a plain dark screen) -->
    <div id="splash">
      <div class="sp-art"></div>
      <div class="sp-logo"><span>SWARM</span><span class="l2">BLASTER</span></div>
      <div class="sp-bottom">
        <div class="sp-bar"><i id="spbar"></i><b id="sppct">0%</b></div>

      </div>
    </div>
    <style>#splash{z-index:50;color:#fff;background:#f07a1c;font-family:"Baloo 2",ui-rounded,system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Noto Sans,Ubuntu,Cantarell,Helvetica Neue,sans-serif;transition:opacity .45s;position:fixed;top:0;bottom:0;left:0;right:0;overflow:hidden}#splash.gone{opacity:0;pointer-events:none}#splash .sp-art{background:url(splash.jpg) 50% 62%/cover no-repeat;position:absolute;top:0;bottom:0;left:0;right:0}#splash .sp-art:after{content:"";background:linear-gradient(#10153acc 0%,#10153a00 30%,#10153a00 62%,#10153ae6 100%);position:absolute;top:0;bottom:0;left:0;right:0}#splash .sp-logo{left:0;right:0;top:max(56px, calc(env(safe-area-inset-top) + 24px));text-align:center;font-weight:800;line-height:.86;position:absolute;transform:rotate(-4deg)}#splash .sp-logo span{color:#ffd23f;-webkit-text-stroke:7px #10153a;paint-order:stroke fill;text-shadow:0 7px #10153a,0 12px 24px #000a;font-size:min(78px,19vw);display:inline-block}#splash .sp-logo .l2{color:#8fe0ff;font-size:min(70px,17vw)}#splash .sp-logo{flex-direction:column;align-items:center;display:flex}#splash .sp-bottom{left:0;right:0;bottom:max(40px, calc(env(safe-area-inset-bottom) + 22px));flex-direction:column;align-items:center;gap:12px;padding:0 24px;display:flex;position:absolute}#splash .sp-bar{background:#10153a;border:4px solid #10153a;border-radius:16px;width:min(320px,78vw);height:30px;position:relative;overflow:hidden;box-shadow:0 5px #0008}#splash .sp-bar i{background:linear-gradient(#fff3a0,#ffc23d 45%,#ff8a1e);border-radius:10px;width:4%;transition:width .25s;position:absolute;top:0;bottom:0;left:0}#splash .sp-bar i:after{content:"";background:#ffffff8a;border-radius:4px;height:6px;position:absolute;top:3px;left:6px;right:6px}#splash .sp-bar b{-webkit-text-stroke:3px #10153a;paint-order:stroke fill;place-items:center;font-size:16px;font-weight:800;display:grid;position:absolute;top:0;bottom:0;left:0;right:0}#splash .sp-tip{text-align:center;-webkit-text-stroke:3px #10153a;paint-order:stroke fill;text-wrap:balance;max-width:340px;min-height:44px;font-size:16px;font-weight:700;line-height:1.25}</style>
    <canvas id="stage"></canvas>
    <div id="vig"></div>
    <div id="shade"></div>
    <div id="hud" class="hidden">
      <div id="topbar"><div id="lvbadge"><b id="lv">1</b></div><div id="xp"><i id="xpbar"></i></div></div>
      <div id="row2">
        <div id="weps"></div>
        <div id="mid"><div id="time">0:00</div><div id="goal"><span id="goaltxt">BOSS IN 4:30</span><div id="goaltrack"><i id="goalbar"></i><b id="goalmini"></b><b id="goalboss"></b></div></div></div>
        <div id="right"><button id="pause" aria-label="Pause"></button><div id="kills"><i id="skullic"></i><b>0</b></div></div>
      </div>
      <div id="boss" class="hidden"><div class="bname"><i id="bossic"></i><span id="bossname">BOSS</span></div><div class="bbar"><i id="bossbar"></i></div></div>
    </div>
    <div id="hpw" class="hidden"><i id="hpbar"></i></div>
    <div id="banner" class="hidden"></div>
    <div id="combo" class="hidden"><b>0</b><span>COMBO</span></div>
    <div id="toast"></div>
    <div id="hurt"></div>
    <div id="stick" class="hidden"><i></i></div>
    <div id="acts" class="hidden"><button id="dashbtn" aria-label="Dash"><i id="dashic"></i><span>DASH</span></button><button id="spbtn" aria-label="Blast"><i id="spic"></i><span>BLAST</span></button></div>
    <div id="screen"></div>
