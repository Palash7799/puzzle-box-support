<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4ab8ff" />
    
    <title>Bob: Bounce Ball Tales</title>
    <!-- added to the Home Screen it opens full screen, without the browser's bars -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bob Bounce" />
    <link rel="apple-touch-icon" href="./icon-180.png" />
    <meta name="description" content="Bob: Bounce Ball Tales - roll and bounce Bob, a little red ball, through 8 worlds of gems, traps and secrets. A classic bounce ball adventure." />
    <script type="module" crossorigin src="./assets/index-C5ANG6Dh.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-x07D89IC.css">
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="hud" class="hidden">
      <div class="pill" id="gems"><svg class="gm" viewBox="0 0 32 32"><path d="M9 4h14l7 8-14 17L2 12z" fill="#7fe8ff" stroke="#1d0f33" stroke-width="2.6" stroke-linejoin="round"/><path d="M2 12h28M9 4l3 8 4 17 4-17 3-8" fill="none" stroke="#1d0f33" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12l4-8 4 8z" fill="#e8fbff"/><path d="M3.5 12h8.5l4 15z" fill="#36b8e8"/></svg><b id="gemN">0</b><span id="gemT">/ 30</span></div>
      <div class="pill" id="mission"><i id="mIcon"></i><span id="mLbl"></span><b id="mN">0/0</b></div>
      <div class="pill" id="time"><svg class="ic clk" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path class="ln" d="M12 9v4l3 2M10 3h4"/></svg><b id="timeN">0:00</b></div>
      <button class="pill rock btn hidden" id="rock" aria-label="Turn back into Bob">Rock form <b id="rockN"></b><span>tap: back to Bob</span></button>
      <button class="pill btn hidden" id="skip" aria-label="Watch an ad to skip this level">⏭ Skip (ad)</button>
      <button class="pill btn rb" id="mute" aria-label="Sound on or off"><svg class="ic on" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ln" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg><svg class="ic off" viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="ln" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg></button>
      <button class="pill btn rb" id="hudmap" aria-label="World map"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path class="ln" d="M9 4v14M15 6v14"/></svg></button>
      <button class="pill btn rb" id="pause" aria-label="Restart"><svg class="ic" viewBox="0 0 24 24"><path class="ln" d="M19 12a7 7 0 1 1-2.6-5.4"/><path d="M20.5 3v6.5H14z"/></svg></button>
    </div>
    <div id="bossbar" class="hidden"><b id="bbName"></b><span id="bbHp"></span></div>
    <div id="touch" class="hidden">
      <div class="pad">
        <button id="bl" aria-label="Left"><svg viewBox="0 0 24 24"><path d="M15.5 4.5L8 12l7.5 7.5"/></svg></button>
        <button id="br" aria-label="Right"><svg viewBox="0 0 24 24"><path d="M8.5 4.5L16 12l-7.5 7.5"/></svg></button>
      </div>
      <div class="jumps">
        <button id="bd" aria-label="Slam"><svg viewBox="0 0 24 24"><path d="M6 7l6 6 6-6"/><path d="M5 18h14"/></svg></button>
        <button id="bj" aria-label="Jump"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
      </div>
    </div>
    <div id="formtip" class="hidden"><div></div></div>
    <div id="swipehint" class="hidden"><div><b>Left thumb</b>: drag to roll &nbsp;·&nbsp; <b>Right thumb</b>: flick ⬆ jump, ⬇ slam</div></div>
    <div id="title" class="screen">
      <div class="titleart"></div>
      <div class="titlebox">
        <h1 class="logo"><img class="logoimg" src="./ui/logo.png" alt="Bob: Bounce Ball Tales" draggable="false" /></h1>
        <button id="play" class="playbtn loading" aria-label="Play"><img src="./ui/btn-play.png" alt="" draggable="false" /><b class="ld">loading…</b></button>
        <div class="trow">
          <button id="tmute" class="ibtn" aria-label="Sound on or off"><img src="./ui/btn-sound.png" alt="" draggable="false" /></button>
          <button id="ctlBtn" class="ibtn" aria-label="Controls: buttons or swipe"><img src="./ui/btn-controls.png" alt="" draggable="false" /><span id="ctlLbl" class="cap">Buttons</span></button>
          <button id="lookBtn" class="ibtn" style="display:none" aria-label="2D or 3D look"><img src="./ui/btn-look.png" alt="" draggable="false" /><span id="lookLbl" class="cap">3D</span></button>
        </div>
      </div>
    </div>
    <div id="map" class="hidden">
      <div class="mapart" id="mapart"></div>
      <div id="maploading" class="hidden"></div>
      <div class="maptop"><button class="pill btn" id="mapback" aria-label="Back"><svg class="ic" viewBox="0 0 24 24" style="font-size:22px"><path d="M16 4L6 12l10 8z"/></svg></button><b class="maptitle">Bob's World</b><button class="pill btn hidden" id="bellBtn" aria-label="Daily reminder on or off">🔔</button><div class="pill" id="mapgems"><svg class="gm" viewBox="0 0 32 32"><path d="M9 4h14l7 8-14 17L2 12z" fill="#7fe8ff" stroke="#1d0f33" stroke-width="2.6" stroke-linejoin="round"/><path d="M2 12h28M9 4l3 8 4 17 4-17 3-8" fill="none" stroke="#1d0f33" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12l4-8 4 8z" fill="#e8fbff"/><path d="M3.5 12h8.5l4 15z" fill="#36b8e8"/></svg><b id="mapgemN">0</b></div></div>
    </div>
    <div class="mapbtns" id="mapbtns">
      <button id="dailyBtn" class="mbtn daily" aria-label="Daily challenge"><span class="ico">📅</span><span class="lb">DAILY DASH</span><b id="dailyN">NEW</b></button>
      <button id="shopBtn" class="mbtn shop" aria-label="Shop"><span class="ico">🛍️</span><span class="lb">SHOP</span></button>
    </div>
    <div id="stagepick" class="screen hidden">
      <div class="card win sp">
        <div class="ribbon"><span id="spName"></span></div>
        <p id="spTeach"></p>
        <div id="spList"></div>
        <button id="spClose" class="rbtn blue" aria-label="Back to map"><svg class="ic" viewBox="0 0 24 24"><path d="M16 4L6 12l10 8z"/></svg></button>
      </div>
    </div>
    <div id="newform" class="screen hidden">
      <div class="card win nf">
        <div class="ribbon"><span>New form!</span></div>
        <img id="nfImg" class="nfimg" src="./sprites2d/bob-bubble.png" alt="" draggable="false" />
        <h2 id="nfName"></h2>
        <p id="nfText"></p>
        <button id="nfGo" class="gbtn">LET'S GO <svg class="ic" viewBox="0 0 24 24"><path d="M7 4l11 8-11 8z"/></svg></button>
      </div>
    </div>
    <div id="story" class="screen hidden">
      <div class="card win st">
        <div class="ribbon"><span id="stRib"></span></div>
        <img class="nfimg" src="./sprites2d/bob-happy.png" alt="" draggable="false" />
        <p id="stText"></p>
        <div id="stReward" class="streward hidden"><small>NEW POWER</small><h2 id="stRName"></h2><p id="stRText"></p></div>
        <button id="stGo" class="gbtn">LET'S GO</button>
      </div>
    </div>
    <div id="shop" class="screen hidden">
      <div class="card win shopc">
        <div class="ribbon"><span>Bob's Shop</span></div>
        <div class="shtop"><div class="shtabs"><button class="shtab on" data-k="skin">Skins</button><button class="shtab" data-k="trail">Trails</button><button class="shtab" data-k="sound">Sounds</button></div><div class="pill wallet">💎 <b id="shopCoins">0</b></div></div>
        <div id="shopGrid"></div>
        <button id="shopClose" class="rbtn blue" aria-label="Close the shop"><svg class="ic" viewBox="0 0 24 24"><path d="M16 4L6 12l10 8z"/></svg></button>
      </div>
    </div>
    <div id="remind" class="screen hidden">
      <div class="card win nf">
        <div class="ribbon"><span>Daily Dash</span></div>
        <img class="nfimg" src="./sprites2d/bob-cheer.png" alt="" draggable="false" />
        <p>A new Daily Dash stage comes out every day. Want a little reminder in the evening, so you never lose your streak?</p>
        <div class="brow"><button id="rmNo" class="rbtn blue" aria-label="Not now">✕</button><button id="rmYes" class="gbtn">YES PLEASE</button></div>
      </div>
    </div>
    <div id="done" class="screen hidden">
      <div class="rays"></div>
      <div id="confetti"></div>
      <div class="card win">
        <div class="ribbon"><span id="doneRibbon">Bob made it!</span></div>
        <img class="cheer" src="./sprites2d/bob-cheer.png" alt="" draggable="false" />
        <div class="stars"><i id="st1"><svg viewBox="0 0 48 48"><path d="M24 3.5l6.2 12.6 13.9 2-10 9.8 2.4 13.8L24 35.2l-12.5 6.5 2.4-13.8-10-9.8 13.9-2z"/></svg></i><i id="st2" class="mid"><svg viewBox="0 0 48 48"><path d="M24 3.5l6.2 12.6 13.9 2-10 9.8 2.4 13.8L24 35.2l-12.5 6.5 2.4-13.8-10-9.8 13.9-2z"/></svg></i><i id="st3"><svg viewBox="0 0 48 48"><path d="M24 3.5l6.2 12.6 13.9 2-10 9.8 2.4 13.8L24 35.2l-12.5 6.5 2.4-13.8-10-9.8 13.9-2z"/></svg></i></div>
        <div id="dMission" class="dmission"></div>
        <div id="dEarn" class="dearn"></div>
        <div class="stats">
          <div class="chip"><svg class="gm" viewBox="0 0 32 32"><path d="M9 4h14l7 8-14 17L2 12z" fill="#7fe8ff" stroke="#1d0f33" stroke-width="2.6" stroke-linejoin="round"/><path d="M2 12h28M9 4l3 8 4 17 4-17 3-8" fill="none" stroke="#1d0f33" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 12l4-8 4 8z" fill="#e8fbff"/><path d="M3.5 12h8.5l4 15z" fill="#36b8e8"/></svg><b id="dGems"></b></div>
          <div class="chip"><svg class="ic clk" viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path class="ln" d="M12 9v4l3 2M10 3h4"/></svg><b id="dTime"></b></div>
          <div class="chip"><svg class="ic skull" viewBox="0 0 24 24"><path d="M12 3a8 8 0 0 0-8 8c0 2.6 1.3 4.6 3 5.8V20h10v-3.2c1.7-1.2 3-3.2 3-5.8a8 8 0 0 0-8-8z"/><circle class="hole" cx="9" cy="11.5" r="1.8"/><circle class="hole" cx="15" cy="11.5" r="1.8"/></svg><b id="dDeaths"></b></div>
        </div>
        <div class="brow">
          <button id="tomap" class="rbtn blue" aria-label="Map"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path class="ln" d="M9 4v14M15 6v14"/></svg></button>
          <button id="again" class="rbtn orange" aria-label="Play again"><svg class="ic" viewBox="0 0 24 24"><path class="ln" d="M19 12a7 7 0 1 1-2.6-5.4"/><path d="M20.5 3v6.5H14z"/></svg></button>
          <button id="next" class="gbtn hidden">NEXT <svg class="ic" viewBox="0 0 24 24"><path d="M7 4l11 8-11 8z"/></svg></button>
        </div>
      </div>
    </div>
  </body>
</html>
